<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Husqvarna Automatic 21 A &mdash; Operating Manual (A4 edition)</title>
<style>
@page { size: 210mm 297mm; margin: 0; }

@font-face { font-family: 'Garamond EB'; src: url('fonts/EBGaramond-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'Garamond EB'; src: url('fonts/EBGaramond-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; }
@font-face { font-family: 'Garamond EB'; src: url('fonts/EBGaramond-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; }
@font-face { font-family: 'Jost'; src: url('fonts/Jost-Light.ttf') format('truetype'); font-weight: 300; }
@font-face { font-family: 'Jost'; src: url('fonts/Jost-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Jost'; src: url('fonts/Jost-Medium.ttf') format('truetype'); font-weight: 500; }
@font-face { font-family: 'Jost'; src: url('fonts/Jost-SemiBold.ttf') format('truetype'); font-weight: 600; }

:root {
  --paper: #FCFBF3;
  --ink: #1b1b18;
  --green: #CCE9CA;
  --green-deep: #1d4a2a;
  --rule: #8fbb95;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #6d6d6d; }

body {
  font-family: 'Garamond EB', Garamond, serif;
  color: var(--ink);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ---------- page, with the inner margin widened for the binding ---------- */
.page {
  position: relative;
  width: 210mm;
  height: 288mm;
  background: var(--paper);
  overflow: hidden;
  page-break-after: always;
  break-after: page;
  margin: 0 auto 6mm;
  box-shadow: 0 2px 10px rgba(0,0,0,.35);
  padding: 18mm 15mm 18mm 24mm;   /* recto: inner margin on the left */
}
.page.verso { padding: 18mm 24mm 18mm 15mm; }   /* verso: inner margin on the right */
.page:last-child { page-break-after: auto; }

@media print {
  html, body { background: var(--paper); }
  .page { margin: 0; box-shadow: none; }
}

/* ---------- page skeleton: banner, two-column text, full-width figure strip ----------
   The columns never use column-span: a spanner inside a fixed-height multicol makes
   Chrome restart the column set and push the rest of the text off the sheet. */
.sheet { display: flex; flex-direction: column; height: 100%; }
.flow {
  column-count: 2;
  column-gap: 8mm;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  column-fill: balance;
}
/* denser settings for the two or three pages that carry the most copy */
.flow.dense p, .flow.dense li { font-size: 9.1pt; }
.flow.tight p, .flow.tight li { font-size: 8.6pt; line-height: 1.3; }
.flow.tight li { margin-bottom: .6mm; }
.flow.tight ol { margin-top: .7mm; }
.flow.tight h5 { font-size: 9pt; margin: 2.6mm 0 .9mm; }

.band { flex: 0 0 auto; margin-top: 5mm; }
.band.top { margin: 0 0 5mm; }
.one { height: 100%; }

/* ---------- typography ---------- */
p {
  margin: 0;
  font-size: 9.6pt;
  line-height: 1.33;
  text-align: justify;
  hyphens: auto;
  -webkit-hyphens: auto;
  text-indent: 4.5mm;
}
p.flush { text-indent: 0; }
p.it { font-style: italic; }
p.lead { text-indent: 0; font-size: 10.4pt; line-height: 1.4; }

h2 {
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  font-size: 20pt;
  line-height: 1.2;
  margin: 0;
  color: var(--green-deep);
}
h3 {
  font-family: 'Jost', sans-serif;
  font-weight: 600;
  font-size: 10.4pt;
  line-height: 1.22;
  margin: 4.5mm 0 1.6mm;
  break-after: avoid;
}
h3:first-child { margin-top: 0; }
h4 {
  font-family: 'Jost', sans-serif;
  font-weight: 500;
  font-size: 9.8pt;
  margin: 3.8mm 0 1.4mm;
  break-after: avoid;
}
h5 {
  font-style: italic;
  font-weight: 400;
  font-size: 10pt;
  margin: 3.4mm 0 1.2mm;
  break-after: avoid;
}
h5:first-child, h4:first-child { margin-top: 0; }

ol, ul { margin: 1.2mm 0 0; padding-left: 5.4mm; }
li {
  font-size: 9.6pt;
  line-height: 1.32;
  margin-bottom: 1.2mm;
  text-align: justify;
  hyphens: auto;
  -webkit-hyphens: auto;
}
ol.alpha { list-style: lower-alpha; }

/* ---------- figures ---------- */
figure { margin: 3.5mm 0; break-inside: avoid; }
figure img { display: block; width: 100%; height: auto; }
figcaption {
  font-style: italic;
  font-size: 8.6pt;
  text-align: center;
  margin-top: 1.2mm;
}
/* keep any single illustration from eating a whole column */
.flow figure img { max-height: 52mm; width: auto; max-width: 100%; margin: 0 auto; }
.flow figure.tall img { max-height: 74mm; }
.flow figure.small img { max-height: 34mm; }
.band figure { margin: 0; display: flex; flex-direction: column; height: 100%; }
.band figure img { margin-top: auto; }
.band figure img { max-height: 46mm; width: auto; max-width: 100%; margin: 0 auto; }
.band figure.tall img { max-height: 62mm; }
.band.low figure img { max-height: 36mm; }
.band.low figure.tall img { max-height: 48mm; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
.trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6mm; }
.duo figure, .trio figure { margin: 0; }
.mul { mix-blend-mode: multiply; }

/* ---------- the green section banner ---------- */
.bar {
  flex: 0 0 auto;
  background: var(--green);
  display: flex;
  align-items: center;
  gap: 7mm;
  padding: 6mm 8mm;
  margin: 0 0 6mm;
  min-height: 26mm;
}
.bar .art { height: 30mm; width: auto; flex: 0 0 auto; }
.bar.tall { min-height: 34mm; }
.bar.tall .art { height: 40mm; }

/* ---------- boxes and tables ---------- */
.notebox {
  border: .4mm solid var(--rule);
  background: #F3FAF2;
  padding: 4mm 5mm;
  margin: 3.5mm 0;
  break-inside: avoid;
}
.notebox .n {
  font-family: 'Jost', sans-serif;
  font-weight: 600;
  letter-spacing: .26em;
  display: block;
  text-align: center;
  margin-bottom: 2mm;
}
.notebox p, .notebox li { font-size: 9pt; }

table { border-collapse: collapse; width: 100%; font-size: 8.2pt; }
table.rule th, table.rule td { border: .25mm solid #7d7d75; padding: 1mm 1.6mm; vertical-align: top; }
table.rule th { font-family: 'Jost', sans-serif; font-weight: 500; text-align: left; background: #EEF6EC; }
table.plain td { padding: .6mm 2mm .6mm 0; vertical-align: top; }
.tcap { font-style: italic; font-size: 9pt; margin: 0 0 1.4mm; }

/* ---------- page furniture ---------- */
.folio {
  position: absolute;
  bottom: 9mm;
  font-family: 'Jost', sans-serif;
  font-weight: 500;
  font-size: 10pt;
  color: var(--green-deep);
}
.page .folio { right: 15mm; }
.page.verso .folio { left: 15mm; right: auto; }

.rhead {
  position: absolute;
  top: 9mm;
  font-family: 'Jost', sans-serif;
  font-weight: 400;
  font-size: 8pt;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #6d7a6b;
}
.page .rhead { right: 15mm; }
.page.verso .rhead { left: 15mm; right: auto; }

/* ---------- key lists beside the big machine views ---------- */
.keylist { font-size: 9.4pt; line-height: 1.45; }
.keylist div { display: flex; gap: 2.5mm; }
.keylist span.n { flex: 0 0 7mm; text-align: right; }

/* ---------- covers ---------- */
.page.cover { padding: 0; overflow: hidden; }
.cover-art {
  position: absolute;
  inset: 0;
  background-image: url('img/cover_texture.jpg');
  background-size: 100% auto;
  background-repeat: repeat-y;
  background-position: top center;
}
.cover-inner {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: #10321c;
}

/* ---------- table of contents ---------- */
.toc { column-count: 3; column-gap: 7mm; font-size: 8.4pt; line-height: 1.42; }
.toc .grp { break-inside: avoid; margin-bottom: 2.4mm; }
.toc .hd { font-family: 'Jost', sans-serif; font-weight: 600; font-size: 8.6pt; }
.toc .row { display: flex; justify-content: space-between; gap: 2mm; }
.toc .row.sub { padding-left: 3mm; }
.toc .row .p { font-variant-numeric: lining-nums; }
</style>
</head>
<body>
